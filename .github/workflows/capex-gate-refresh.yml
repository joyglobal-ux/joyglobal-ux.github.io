name: CAPEX gate credit refresh

on:
  schedule:
    # UTC. 금요일 미국 장마감 후 주 1회.
    # 판정 기준이 "13주 방향"이라 매일 돌릴 이유가 없다 — 매일 갱신은 노이즈이자
    # 실패 알림의 원천이었다(2026-08 23일 연속 실패). 주 1회면 충분.
    - cron: "40 22 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: capex-gate-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect credit layer
        run: |
          pip install requests
          for attempt in 1 2 3; do
            echo "::group::refresh attempt $attempt"
            if python capex-gate/refresh.py; then
              echo "::endgroup::"; echo "ok on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          echo "all attempts failed"; exit 1

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capex-gate/data.js capex-gate/data.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: capex-gate 크레딧 레이어 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
