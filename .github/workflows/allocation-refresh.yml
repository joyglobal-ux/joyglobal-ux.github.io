name: Allocation refresh

on:
  schedule:
    # UTC. KR 마감 후(08:10) · US 마감 후(22:50). 종목 리스트 Actions(07:00/21:30 UTC)가 breadth 재료를 먼저 갱신한다.
    - cron: "10 8 * * 1-5"
    - cron: "50 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: allocation-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: |
          pip install requests pandas yfinance
          for attempt in 1 2 3; do
            if python allocation/refresh.py; then echo "ok on attempt $attempt"; exit 0; fi
            echo "attempt $attempt failed"; [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1
      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allocation/data.js allocation/data.json allocation/history.json
          if git diff --staged --quiet; then echo "No data changes."; else
            git commit -m "data: allocation refresh $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
